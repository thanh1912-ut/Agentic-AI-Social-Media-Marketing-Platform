# Optional source-build override for the root Compose stack.
# Run from the repository root with:
# docker compose -f docker-compose.yml -f infra/docker-compose.yml up --build
# The root file owns environment, ports, dependencies and health checks.

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile

  worker:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
