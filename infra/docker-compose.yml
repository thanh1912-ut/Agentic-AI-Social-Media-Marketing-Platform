# Compose stack cho môi trường dev.
# Stack hạ tầng dùng chung (postgres/redis/minio) nằm ở ../docker-compose.yml
# File này dành cho các service build từ source: api, worker, agents, web.

services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    env_file:
      - ../.env
    depends_on:
      - redis

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    depends_on:
      - api
