[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-social-media-marketing-platform"
version = "0.1.0"
description = "AI, RAG and analytics primitives for the Agentic AI Social Media Marketing Platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "email-validator>=2.1,<3",
  "fastembed>=0.8.1,<0.9",
  "fastapi>=0.115,<1",
  "langgraph>=0.2,<1",
  "openai>=1.68,<3",
  "openpyxl>=3.1,<4",
  "pgvector>=0.3,<1",
  "Pillow>=10,<13",
  "pypdf>=5,<6",
  "pydantic>=2.7,<3",
  "PyJWT>=2.8,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "fixture_integration: backend/API integration using deterministic model fixtures",
  "api_smoke: explicit live provider smoke tests that may incur API cost",
]

[tool.setuptools.packages.find]
include = ["database*", "packages*", "services*"]
